<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/nexus-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEXUS</title>
    <script>
      // Apply the last used theme before the app loads, so a dark window does not open bright.
      try {
        var t = localStorage.getItem("nexus-theme");
        if (t === "dark" || t === "bright") document.documentElement.setAttribute("data-theme", t);
        var a = localStorage.getItem("nexus-accent");
        if (a && /^[a-z]+$/.test(a)) document.documentElement.setAttribute("data-accent", a);
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
